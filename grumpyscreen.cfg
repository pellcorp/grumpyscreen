[default_macros]
cooldown: TURN_OFF_HEATERS
extrude: _GUPPYSCREEN_EXTRUDE EXTRUDER_TEMP={} EXTRUDE_LEN={} SPEED={}
retract: _GUPPYSCREEN_RETRACT EXTRUDER_TEMP={} EXTRUDE_LEN={} SPEED={}
load_filament: LOAD_FILAMENT EXTRUDER_TEMP={}
unload_filament: UNLOAD_FILAMENT EXTRUDER_TEMP={}

[ui]
invert_z_icon: false
prompt_emergency_stop: true
# specify -1 for never
display_sleep_sec: 600
# log levels are info, debug, trace
log_level: info
display_rotate: 3
# for displaying the current chamber temp
chamber_temp_sensor: temperature_sensor chamber_temp
# comma-separated extruder panel button values
extruder_temp_presets: 200, 220, 240, 260, 280
extruder_temp_default: 220
extruder_length_presets: 5, 10, 20, 50, 100
extruder_length_default: 10
extruder_speed_presets: 1, 2, 5, 10, 25
extruder_speed_default: 5

# blue = primary_colour: 0x2196F3, secondary_colour: 0xF44336
# green = primary_colour: 0x4CAF50, secondary_colour: 0xF44336
# pink = primary_colour: 0xFEC5E5, secondary_colour: 0xE91E63
# purple = primary_colour: 0x9C27B0, secondary_colour: 0xF44336
# red = primary_colour: 0xF44336, secondary_colour: 0xF44336
# yellow = primary_colour: 0xFFEB3B, secondary_colour: 0xF44336
[theme]
primary_colour: 0x2196F3
secondary_colour: 0xF44336

# Everything below is optional -- leave a key out and it keeps the stock value
# shown beside it. These are the roles the whole UI is built from, so one edit
# here restyles every panel. Values are hex, same format as the two above.
#
# the page behind everything            0x282B30
# background_colour: 0x282B30
# cards, panels, popout boxes           0x212121
# surface_colour: 0x212121
# buttons, and a surface pressed        0x424242
# raised_colour: 0x424242
# hairline around a surface             0x424242
# border_colour: 0x424242
# hairline around a small tile          0x616161
# border_dim_colour: 0x616161
# default label                         0xFFFFFF
# text_colour: 0xFFFFFF
# section titles, secondary text        0x9E9E9E
# text_dim_colour: 0x9E9E9E
# greyed-out label or icon              0x757575
# disabled_colour: 0x757575
# text drawn on the primary colour       0xFFFFFF
# on_primary_colour: 0xFFFFFF
# faults                                0xC62828
# danger_colour: 0xC62828
# notable, but not a fault              0xFF8F00
# warning_colour: 0xFF8F00
#
# Corner rounding and spacing, in pixels at the 480x272 design size; both scale
# with the display. radius sets cards, buttons come out 2px tighter and panels
# 2px softer, so 0 gives a completely square UI. gap is the one spacing unit:
# screen edges, the space between tiles, rows and cards, the padding inside a
# panel, and the margin round a popout all follow it.
# radius: 6
# gap: 6

[mmu]
# afc = ArmoredTurtle AFC (BoxTurtle, Canvas, ...), none = no MMU panel at all
backend: none
# Comma-separated materials for the lane edit screen: the first four show
# inline, the rest join the built-in list in its "more materials" popout
materials: PLA, PETG, ABS, TPU

[moonraker]
host: 127.0.0.1
port: 7125
# set this if host is not 127.0.0.1 / localhost or you want to download thumbnails
thumbnail_path:

[commands]
factory_reset_cmd: /etc/init.d/S58factoryreset reset
gui_restart_cmd: /etc/init.d/S99grumpyscreen restart
switch_to_stock_cmd: /usr/data/pellcorp/k1/switch-to-stock.sh
support_zip_cmd: /usr/data/pellcorp/tools/support.sh
restart_klipper_cmd: /etc/init.d/S55klipper_service restart
shutdown_host_cmd: /sbin/halt
restart_wifi_cmd: /usr/data/pellcorp/k1/tools/restart_wifi.sh

[fan "fan_generic part"]
display_name: Toolhead

[fan "output_pin fan0"]
display_name: Toolhead

[fan "fan"]
display_name: Toolhead

[fan "fan_generic chamber"]
display_name: Chamber

[fan "output_pin fan1"]
display_name: Chamber

[fan "fan_generic auxiliary"]
display_name: Auxiliary

[fan "output_pin fan2"]
display_name: Auxiliary

[led "output_pin LED"]
display_name: LED
pwm: false

[led "output_pin red_pin"]
display_name: Red
pwm: false

[led "output_pin green_pin"]
display_name: Green
pwm: false

[led "output_pin yellow_pin"]
display_name: Yellow
pwm: false

[led "output_pin light_pin"]
display_name: Light
pwm: false

[monitored_sensor "extruder"]
display_name: Extruder
color: red
controllable: true

[monitored_sensor "heater_bed"]
display_name: Bed
color: purple
controllable: true

[monitored_sensor "temperature_fan chamber_fan"]
display_name: Chamber
color: blue
controllable: true
