[mcu]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: cartesian
max_velocity: 100
max_accel: 100
max_z_velocity: 5
max_z_accel: 100

[stepper_x]
step_pin: gpiochip1/gpio0
dir_pin: gpiochip1/gpio1
enable_pin: gpiochip1/gpio2
endstop_pin: ^gpiochip1/gpio3
microsteps: 1
rotation_distance: 40
position_endstop: 0
position_max: 300
position_min: -15
homing_speed: 50
homing_retract_dist: 0

[stepper_y]
step_pin: gpiochip2/gpio0
dir_pin: gpiochip2/gpio1
enable_pin: gpiochip2/gpio2
endstop_pin: ^gpiochip2/gpio3
microsteps: 1
rotation_distance: 40
position_endstop: 0
position_max: 300
position_min: -15
homing_speed: 50
homing_retract_dist: 0

[stepper_z]
step_pin: gpiochip3/gpio0
dir_pin: gpiochip3/gpio1
enable_pin: gpiochip3/gpio2
endstop_pin: probe:z_virtual_endstop
microsteps: 1
rotation_distance: 40
position_max: 250
position_min: -2
homing_retract_dist: 0

[probe]
pin: ^gpiochip5/gpio0
x_offset: 0
y_offset: 0
z_offset: 0.5
speed: 5.0
samples: 1
lift_speed: 5

[bed_mesh]
speed: 100
horizontal_move_z: 5
mesh_min: 10, 10
mesh_max: 290, 290
probe_count: 5, 5

[safe_z_home]
home_xy_position: 150, 150
speed: 100
z_hop: 5
z_hop_speed: 20

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[exclude_object]

[pause_resume]

[display_status]

[respond]

[adc_temperature extruder_adc]
temperature1: 0
voltage1: 0
temperature2: 500
voltage2: 3.3

[extruder]
step_pin: gpiochip4/gpio0
dir_pin: gpiochip4/gpio1
enable_pin: gpiochip4/gpio2
heater_pin: gpiochip4/gpio3
sensor_pin: analog1
sensor_type: extruder_adc
adc_voltage: 3.3
control: watermark
microsteps: 1
rotation_distance: 33.683
nozzle_diameter: 0.400
filament_diameter: 1.750
min_temp: 0
max_temp: 250
min_extrude_temp: 50
max_extrude_only_distance: 50.0
pressure_advance: 0.1
pressure_advance_smooth_time: 0.01

[adc_temperature heater_bed_adc]
temperature1: 0
voltage1: 0
temperature2: 500
voltage2: 3.3

[heater_bed]
heater_pin: gpiochip0/gpio0
sensor_pin: analog0
sensor_type: heater_bed_adc
adc_voltage: 3.3
control: watermark
min_temp: 0
max_temp: 130

[fan]
pin: gpiochip6/gpio0
off_below: 0.2

[heater_fan heater_fan]
pin: gpiochip6/gpio1
off_below: 0.0
shutdown_speed: 1.0
max_power: 1.0

#[led dummy_led]
#red_pin: gpiochip0/gpio2
#green_pin: gpiochip0/gpio3
#blue_pin: gpiochip0/gpio4

[output_pin green_pin]
pin:  gpiochip0/gpio3
pwm: true
value: 0.0

[output_pin red_pin]
pin: gpiochip0/gpio2
pwm: true
value: 0.0

[output_pin yellow_pin]
pin: gpiochip0/gpio4
pwm: true
value: 1.0

[controller_fan controller_fan]
pin: gpiochip6/gpio2
off_below: 0.2
shutdown_speed: 1.0
max_power: 1.0

[filament_motion_sensor runout_sensor]
switch_pin: gpiochip6/gpio3
detection_length: 1.0
extruder: extruder

[output_pin LED]
pin: gpiochip6/gpio4
pwm: false
shutdown_value: 0
value: 1

[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
gcode:
    CANCEL_PRINT_BASE

[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP=params.BED_TEMP|default(65)|float %}
    {% set EXTRUDER_TEMP=params.EXTRUDER_TEMP|default(230)|float %}

    G28
    M109 S{EXTRUDER_TEMP}
    M190 S{BED_TEMP}
