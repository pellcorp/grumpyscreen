# The "absolutely not" demo palette.
#
# This is intentionally loud: every theme role gets its own fluorescent colour
# so the palette system is obvious at a glance. It is a demonstration theme,
# not a recommendation for a printer that anyone has to look at for long.
[theme]
primary_colour: 0x39FF14
secondary_colour: 0xFF1493

bg_colour: 0xFF00FF
surface_colour: 0xFFFF00
raised_colour: 0x00FFFF
selected_colour: 0x7F00FF
border_colour: 0xFF6600
border_dim_colour: 0x00FF66

text_colour: 0x18002E
text_dim_colour: 0x6A006A
icon_colour: 0x0000FF
disabled_colour: 0x777777
on_primary_colour: 0x000000

danger_colour: 0xFF0033
warning_colour: 0xFF8800
success_colour: 0x00AA44
info_colour: 0x00AAFF
