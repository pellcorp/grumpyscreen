name: branch build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  compile:
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        include:
          - arch: mipsel-buildroot-linux-musl-
            small: false
            calibrate: false
            build_dir: build/mips

          - arch: mipsel-buildroot-linux-musl-
            small: true
            calibrate: true
            build_dir: build/mips-small

          - arch: armv8-rpi3-linux-gnueabihf-
            small: false
            calibrate: true
            build_dir: build/rpi

    runs-on: ubuntu-22.04
    container:
      image: pellcorp/grumpydev:latest
      options: --user 1001

    env:
      CROSS_COMPILE: ${{ matrix.arch }}
      CC: ${{ matrix.arch }}
      CXX: ${{ matrix.arch }}
      BUILD_DIR: ${{ matrix.build_dir }}

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: set grumpyscreen version
      run: |
        echo "GUPPYSCREEN_BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV
        echo "GUPPYSCREEN_VERSION=${{ github.sha }}" >> $GITHUB_ENV

    - if: matrix.small
      name: export screen size
      run: |
        echo "GUPPY_SMALL_SCREEN=${{ matrix.small }}" >> $GITHUB_ENV

    - if: matrix.calibrate
      name: export touch calibrate
      run: |
        echo "GUPPY_CALIBRATE=${{ matrix.calibrate }}" >> $GITHUB_ENV

    - name: make wpaclient
      run: make wpaclient

    - name: make libhv
      run: make libhv.a

    - name: make grumpyscreen
      run: make -j

  release:
    if: github.event_name == 'push'
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - arch: mipsel-buildroot-linux-musl-
            small: false
            asset: grumpyscreen
            calibrate: false
            build_dir: build/mips

          - arch: mipsel-buildroot-linux-musl-
            small: true
            asset: grumpyscreen-smallscreen
            calibrate: true
            build_dir: build/mips-small

          - arch: armv8-rpi3-linux-gnueabihf-
            small: false
            calibrate: true
            asset: grumpyscreen-rpi
            build_dir: build/rpi

    runs-on: ubuntu-22.04
    container:
      image: pellcorp/grumpydev:latest
      options: --user 1001

    env:
      CROSS_COMPILE: ${{ matrix.arch }}
      CC: ${{ matrix.arch }}
      CXX: ${{ matrix.arch }}
      BUILD_DIR: ${{ matrix.build_dir }}

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: set grumpyscreen version
      run: |
        echo "GUPPYSCREEN_BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV
        echo "GUPPYSCREEN_VERSION=${{ github.sha }}" >> $GITHUB_ENV

    - if: matrix.small
      name: export screen size
      run: |
        echo "GUPPY_SMALL_SCREEN=${{ matrix.small }}" >> $GITHUB_ENV

    - if: matrix.calibrate
      name: export touch calibrate
      run: |
        echo "GUPPY_CALIBRATE=${{ matrix.calibrate }}" >> $GITHUB_ENV

    - name: make wpaclient
      run: make wpaclient

    - name: make libhv
      run: make libhv.a

    - name: make grumpyscreen
      run: make -j

    - name: package release
      run: |
        chmod +x ./release.sh
        ./release.sh ${{ matrix.asset }} ${{ github.sha }} ${{ github.ref_name }} ${{ matrix.build_dir }}

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.asset }}
        path: ./${{ matrix.asset }}.tar.gz

    - name: branch release
      uses: softprops/action-gh-release@v3
      with:
        name: ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        files: |
          ${{ matrix.asset }}.tar.gz
        fail_on_unmatched_files: true

  # versioned zip releases with release_info.json, so moonraker's update manager can update grumpyscreen
  zip-release:
    if: github.event_name == 'push'
    needs: release
    permissions:
      contents: write
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - uses: actions/download-artifact@v7
      with:
        path: artifacts

    - name: package zips
      run: |
        VERSION="v2.0.0-$(git rev-list --count 2.0.0..${{ github.sha }})"
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        for asset in grumpyscreen grumpyscreen-smallscreen grumpyscreen-rpi; do
          mkdir -p "unpack/$asset"
          tar xzf "artifacts/$asset/$asset.tar.gz" -C "unpack/$asset"
          cd "unpack/$asset/grumpyscreen"
          printf '{"project_name": "grumpyscreen", "project_owner": "pellcorp", "version": "%s", "asset_name": "%s.zip"}\n' "$VERSION" "$asset" > release_info.json
          zip -r "$GITHUB_WORKSPACE/$asset.zip" .
          cd "$GITHUB_WORKSPACE"
        done

    - name: versioned release
      uses: softprops/action-gh-release@v3
      with:
        name: ${{ env.VERSION }}
        tag_name: ${{ env.VERSION }}
        target_commitish: ${{ github.sha }}
        make_latest: true
        generate_release_notes: true
        files: |
          grumpyscreen.zip
          grumpyscreen-smallscreen.zip
          grumpyscreen-rpi.zip
        fail_on_unmatched_files: true
