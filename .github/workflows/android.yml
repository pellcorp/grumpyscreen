name: android build

# Unlike branch.yml (cross builds and releases), this only builds an APK, so
# it runs for every branch, forks included, and can be started by hand.
on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE != '' }}
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    # The same grumpydev image ./build.sh android uses locally, built from this
    # checkout's Dockerfile (so it has the JDK and Android SDK before the
    # published image does), with its layers cached between runs.
    - uses: docker/setup-buildx-action@v3

    - name: build the grumpydev image
      uses: docker/build-push-action@v6
      with:
        context: .
        load: true
        tags: pellcorp/grumpydev:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - uses: actions/cache@v4
      with:
        path: android/.gradle-home
        key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: gradle-

    - name: set grumpyscreen version
      run: |
        BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
        VERSION="v2.0.0-$(git rev-list --count 2.0.0..${{ github.sha }})"
        echo "GUPPYSCREEN_BRANCH=$BRANCH" >> $GITHUB_ENV
        echo "GUPPYSCREEN_VERSION=$VERSION" >> $GITHUB_ENV

    - name: setup signing
      if: env.HAS_KEYSTORE == 'true'
      env:
        ENCODED_KS: ${{ secrets.ANDROID_KEYSTORE }}
      run: |
        # inside the checkout, which is all the build container sees
        echo "$ENCODED_KS" | base64 -d > "$GITHUB_WORKSPACE/android/release.jks"
        echo "KEYSTORE=$GITHUB_WORKSPACE/android/release.jks" >> $GITHUB_ENV

    - name: build apk
      env:
        KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: ./build.sh android

    - uses: actions/upload-artifact@v7
      with:
        name: grumpyscreen-android
        path: android/app/build/outputs/apk/release/app-release.apk
