name: android build

# Build installable APKs on every branch, forks included. Only main in the
# upstream repository can access the signing environment and publish releases.
on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    if: >-
      github.repository != 'pellcorp/grumpyscreen' ||
      github.ref != 'refs/heads/main' ||
      (github.event_name != 'push' && github.event_name != 'workflow_dispatch')
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - uses: actions/cache@v4
      with:
        path: android/.gradle-home
        key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: gradle-

    - name: set grumpyscreen version
      run: |
        BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
        VERSION="v2.0.0-$(git rev-list --count 2.0.0..${{ github.sha }})"
        echo "GUPPYSCREEN_BRANCH=$BRANCH" >> $GITHUB_ENV
        echo "GUPPYSCREEN_VERSION=$VERSION" >> $GITHUB_ENV

    - name: build apk
      # in the published pellcorp/grumpydev image, as ./build.sh android does locally
      run: ./build.sh android

    - uses: actions/upload-artifact@v7
      with:
        name: grumpyscreen-android
        path: android/app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error

  release-apk:
    if: >-
      github.repository == 'pellcorp/grumpyscreen' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: android-release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - name: check signing secrets
      env:
        ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        for name in ANDROID_KEYSTORE ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
          if [ -z "${!name}" ]; then
            echo "::error::Missing $name in the android-release environment"
            exit 1
          fi
        done

    - uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - uses: actions/cache@v4
      with:
        path: android/.gradle-home
        key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: gradle-

    - name: set grumpyscreen version
      id: version
      run: |
        VERSION="v2.0.0-$(git rev-list --count 2.0.0..${{ github.sha }})"
        echo "GUPPYSCREEN_BRANCH=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
        echo "GUPPYSCREEN_VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: setup signing
      env:
        ENCODED_KS: ${{ secrets.ANDROID_KEYSTORE }}
      run: |
        umask 077
        printf '%s' "$ENCODED_KS" | base64 -d > "$GITHUB_WORKSPACE/android/release.jks"
        echo "KEYSTORE=$GITHUB_WORKSPACE/android/release.jks" >> "$GITHUB_ENV"

    - name: build signed apk
      env:
        KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: ./build.sh android

    - name: remove signing key
      if: always()
      run: rm -f "$GITHUB_WORKSPACE/android/release.jks"

    - name: name release apk
      run: cp android/app/build/outputs/apk/release/app-release.apk grumpyscreen.apk

    - uses: actions/upload-artifact@v7
      with:
        name: grumpyscreen-android
        path: grumpyscreen.apk
        if-no-files-found: error

  publish:
    needs: release-apk
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/download-artifact@v7
      with:
        name: grumpyscreen-android

    - name: publish android release
      uses: softprops/action-gh-release@v3
      with:
        name: ${{ needs.release-apk.outputs.version }}
        tag_name: ${{ needs.release-apk.outputs.version }}
        target_commitish: ${{ github.sha }}
        files: grumpyscreen.apk
        fail_on_unmatched_files: true
